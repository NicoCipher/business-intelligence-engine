name: Hourly adaptive intelligence collection

# The hourly trigger is only a heartbeat. backend/scheduler.py decides which
# persisted per-(source, domain) collectors are actually due on each run.
on:
  schedule:
    - cron: '0 * * * *'   # hourly, UTC
  workflow_dispatch:
    inputs:
      hn_only:
        description: 'Use HN only (no Reddit credentials required)'
        type: boolean
        default: false

# Least-privilege: this workflow only needs to read the repo, manage its
# own cache, and read/list workflow artifacts (to restore the database
# backup). No write access to repository contents is needed. See the V1
# security review's CI/CD permissions finding.
permissions:
  contents: read
  actions: read

# The CI snapshot is one shared persistence authority. Do not cancel an
# in-progress collector: it may already have committed useful scheduler state.
concurrency:
  group: bia-collection-canonical-snapshot
  cancel-in-progress: false

jobs:
  collect:
    name: Schedule · Collect · Extract · Detect · Report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Restore the database from a previous run ────────────────────────
      # The database accumulates signals across runs. Without this, every run
      # would start from scratch and lose all historical signals.
      # Uses GitHub's cache with a prefix restore key so any previous run's
      # cache is used when no exact match exists (i.e., always on the first
      # restore after an update).
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: backend/data/bia.db
          key: bia-database-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bia-database-${{ runner.os }}-

      # ── Restore the canonical durable snapshot ──────────────────────────
      # Cache is an optimization only. The most recent completed run that
      # published a canonical artifact is authoritative, including a run that
      # failed after committing scheduler/collector state. A retrieval failure
      # for an existing artifact stops this run; only a genuine no-artifact
      # first-run/migration case may use cache or initialize fresh.
      - name: Restore canonical database artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          FOUND_ARTIFACT=false
          RUN_IDS="$(gh run list --workflow=collect.yml --limit=20 --json databaseId,status --jq '.[] | select(.status == "completed") | .databaseId')" || {
            echo "Unable to list completed workflow runs; refusing cache fallback." >&2
            exit 1
          }
          while IFS= read -r RUN_ID; do
            [ -z "$RUN_ID" ] && continue
            ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "bia-database-backup" and .expired == false) | .id')" || {
              echo "Unable to inspect canonical artifacts; refusing cache fallback." >&2
              exit 1
            }
            if [ -z "$ARTIFACT_ID" ]; then
              continue
            fi

            echo "Restoring canonical database artifact from completed run $RUN_ID"
            if ! gh run download "$RUN_ID" -n bia-database-backup -D backend/data/backups/; then
              echo "Canonical artifact retrieval failed; refusing cache fallback." >&2
              exit 1
            fi
            FOUND_ARTIFACT=true
            break
          done <<< "$RUN_IDS"

          if [ "$FOUND_ARTIFACT" = false ]; then
            echo "No prior canonical artifact found -- first run or pre-canonical migration; cache/fresh start is allowed"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Install validated canonical database snapshot
        if: ${{ hashFiles('backend/data/backups/bia-latest.db') != '' }}
        run: python -c "import sys; sys.path.insert(0, 'backend'); import persistence; persistence.restore_canonical_snapshot()"

      # A failure before this point must not republish a cache copy as a new
      # canonical artifact. Once this point is reached, collect.py owns
      # snapshotting transactionally committed database state in its finally.
      - name: Mark persistence authority ready
        id: persistence_authority
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      # ── Run the intelligence pipeline ───────────────────────────────────
      - name: Run collection pipeline
        run: |
          # Determine flags
          FLAGS=""

          # Manual trigger: use workflow input for hn_only
          if [ "${{ github.event.inputs.hn_only }}" = "true" ]; then
            FLAGS="$FLAGS --hn-only"
          fi

          python backend/collect.py $FLAGS
        env:
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          GITHUB_TOKEN:         ${{ github.token }}
          BIA_DATA_DIR:         backend/data

      # ── Durable canonical snapshot ───────────────────────────────────────
      # One SQLite-backup-API snapshot is uploaded, never the historical
      # backup directory. GitHub artifacts provide run-level retention; the
      # latest completed artifact is the cold-start durability fallback. A
      # failed run may still contain valid committed scheduler/collector state;
      # this snapshot is evidence state, not a success verdict for the run.
      - name: Upload canonical database artifact
        if: ${{ always() && steps.persistence_authority.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: bia-database-backup
          path: backend/data/backups/bia-latest.db
          retention-days: 90
          if-no-files-found: warn

      # ── Upload pipeline summary ─────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## BIA-OS Adaptive Scheduler Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run:** \`${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          if [ -f backend/data/bia.db ]; then
            DB_SIZE=$(du -sh backend/data/bia.db | cut -f1)
            echo "- **Database size:** $DB_SIZE" >> $GITHUB_STEP_SUMMARY
          fi
