name: Hourly adaptive intelligence collection

# The hourly trigger is only a heartbeat. backend/scheduler.py decides which
# persisted per-(source, domain) collectors are actually due on each run.
on:
  schedule:
    - cron: '0 * * * *'   # hourly, UTC
  workflow_dispatch:
    inputs:
      hn_only:
        description: 'Use HN only (no Reddit credentials required)'
        type: boolean
        default: false

# Least-privilege: this workflow only needs to read the repo, manage its
# own cache, and read/list workflow artifacts (to restore the database
# backup). No write access to repository contents is needed. See the V1
# security review's CI/CD permissions finding.
permissions:
  contents: read
  actions: read

jobs:
  collect:
    name: Schedule · Collect · Extract · Detect · Report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Restore the database from a previous run ────────────────────────
      # The database accumulates signals across runs. Without this, every run
      # would start from scratch and lose all historical signals.
      # Uses GitHub's cache with a prefix restore key so any previous run's
      # cache is used when no exact match exists (i.e., always on the first
      # restore after an update).
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: backend/data/bia.db
          key: bia-database-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bia-database-${{ runner.os }}-

      # ── Durable backup restore ───────────────────────────────────────────
      # The cache above is best-effort and evictable. This finds the most
      # recent successful run's artifact snapshot (see the upload step
      # further down) and restores it into backend/data/backups/, which
      # collect.py's persistence.pull() then restores from if the
      # cache-provided database doesn't already exist. actions/download-
      # artifact alone can't do this (it only sees the current run without
      # an explicit prior run-id) -- gh CLI (preinstalled, no third-party
      # action) finds that run-id first. Expected to find nothing on the
      # very first run ever; continue-on-error handles that startup case.
      - name: Restore database backup artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow=collect.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then
            echo "Restoring backup artifact from run $RUN_ID"
            gh run download "$RUN_ID" -n bia-database-backup -D backend/data/backups/ || echo "No backup artifact found on run $RUN_ID"
          else
            echo "No previous successful run found -- starting fresh"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # ── Run the intelligence pipeline ───────────────────────────────────
      - name: Run collection pipeline
        run: |
          # Determine flags
          FLAGS=""

          # Manual trigger: use workflow input for hn_only
          if [ "${{ github.event.inputs.hn_only }}" = "true" ]; then
            FLAGS="$FLAGS --hn-only"
          fi

          python backend/collect.py $FLAGS
        env:
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          GITHUB_TOKEN:         ${{ github.token }}
          BIA_DATA_DIR:         backend/data

      # ── Durable backup ───────────────────────────────────────────────────
      # The database cache above is NOT a durability guarantee -- GitHub
      # Actions cache is explicitly subject to eviction with no restore
      # path. collect.py calls persistence.pull()/push() around every run,
      # snapshotting to backend/data/backups/; this step uploads that
      # directory as a build artifact, which has far longer, more explicit
      # retention than the cache. See persistence.py for the pull/push seam
      # this can later be pointed at real durable storage through, without
      # any caller needing to change.
      - name: Upload database backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bia-database-backup
          path: backend/data/backups/
          retention-days: 90
          if-no-files-found: warn

      # ── Upload pipeline summary ─────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## BIA-OS Adaptive Scheduler Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run:** \`${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          if [ -f backend/data/bia.db ]; then
            DB_SIZE=$(du -sh backend/data/bia.db | cut -f1)
            echo "- **Database size:** $DB_SIZE" >> $GITHUB_STEP_SUMMARY
          fi
